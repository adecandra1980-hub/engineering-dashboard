name = "engineering-app"
main = "worker.js"
compatibility_date = "2025-08-01"

# The dashboard (index.html) is served from ./public
[assets]
directory = "./public"
binding = "ASSETS"

# Shared database (Downtime, Work Order, Diesel, OEE parsed cache).
[[d1_databases]]
binding = "DB"
database_name = "engineering-db"
database_id = "369c2eab-a4d7-4785-9c58-a471f19b788b"

# Workers KV namespace that holds the raw OEE .xlsx pushed from SharePoint by
# Power Automate. Create it once:  Cloudflare dashboard -> Storage & Databases ->
# KV -> Create namespace (name e.g. "oee-files") -> copy its ID below.
[[kv_namespaces]]
binding = "OEE_FILES"
id = "oee-files"

# Optional: set a stronger shared secret for the Power Automate POST.
# Either put it here as a plain var, or (better) add INGEST_KEY under
# Settings -> Variables and Secrets in the Cloudflare dashboard.
# [vars]
# INGEST_KEY = "ALCO-oee-7Qx2026"
